# OPTIONAL — only needed if you want a server-level default Oracle connection
# (e.g. a shared read-only service account for teams without their own DB credentials).
#
# The recommended approach for a shared server is for each team to supply their
# own credentials via HTTP headers in their claude_desktop_config.json:
#
#   "args": [
#     "mcp-remote", "http://<server>/mcp",
#     "--header", "x-oracle-user:team_user",
#     "--header", "x-oracle-password:team_pass",
#     "--header", "x-oracle-dsn:host:1521/svc"
#   ]
#
# If you do want a server-level fallback, uncomment and fill in values below,
# then run: kubectl apply -f k8s/secret.yaml
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: mcp-server-oracle-default
#   namespace: ansingh-apps
# type: Opaque
# stringData:
#   ORACLE_USER: "REPLACE_WITH_DB_USER"
#   ORACLE_PASSWORD: "REPLACE_WITH_DB_PASSWORD"
#   ORACLE_DSN: "REPLACE_WITH_HOST:1521/REPLACE_WITH_SERVICE"
